<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Flow Verification</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #results { white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Login Flow Verification</h1>
    
    <div class="test-section">
        <h2>Test Fixed Authentication Flow</h2>
        <button onclick="testLoginFlow()">Run Login Flow Test</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:5050/api';
        
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
            results.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            results.scrollTop = results.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testLoginFlow() {
            log('=== TESTING FIXED LOGIN FLOW ===');
            
            try {
                // Step 1: Create fresh user
                log('Step 1: Creating fresh user...');
                const email = `loginflow${Date.now()}@example.com`;
                const registerResponse = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'Login Flow Test',
                        email: email,
                        password: 'password123'
                    })
                });
                
                if (registerResponse.ok) {
                    log('Step 1: Registration SUCCESS', 'success');
                    
                    // Step 2: Login
                    log('Step 2: Testing login...');
                    const loginResponse = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            password: 'password123'
                        })
                    });
                    
                    if (loginResponse.ok) {
                        const loginData = await loginResponse.json();
                        log('Step 2: Login SUCCESS', 'success');
                        log('Token received: ' + !!loginData.token);
                        log('User received: ' + !!loginData.user);
                        
                        // Step 3: Simulate fixed authentication flow
                        log('Step 3: Simulating FIXED authentication flow...');
                        
                        // Store auth data (like Login.jsx)
                        localStorage.setItem('token', loginData.token);
                        localStorage.setItem('user', JSON.stringify(loginData.user));
                        log('Auth data stored: SUCCESS', 'success');
                        
                        // Simulate FIXED forceAuthCheck with immediate state update
                        log('Step 4: Simulating FIXED forceAuthCheck...');
                        const storedUser = localStorage.getItem('user');
                        const storedToken = localStorage.getItem('token');
                        
                        if (storedUser && storedToken) {
                            try {
                                const parsedUser = JSON.parse(storedUser);
                                log('Immediate state update:', 'success');
                                log('- setUser(parsedUser): SUCCESS');
                                log('- setLoading(false): SUCCESS');
                                log('- isAuthenticated: true');
                                
                                // Step 5: Check ProtectedRoute behavior
                                log('Step 5: ProtectedRoute behavior after fix:');
                                const isAuthenticated = !!parsedUser && !!storedToken;
                                const loading = false;
                                
                                log('- loading: ' + loading);
                                log('- isAuthenticated: ' + isAuthenticated);
                                
                                if (loading) {
                                    log('- ProtectedRoute would show: LOADING');
                                } else if (!isAuthenticated) {
                                    log('- ProtectedRoute would show: REDIRECT TO LOGIN', 'error');
                                } else {
                                    log('- ProtectedRoute would show: DASHBOARD', 'success');
                                }
                                
                                // Step 6: Navigation
                                log('Step 6: Navigation after fix:');
                                log('- navigate("/dashboard") called');
                                log('- ProtectedRoute allows access');
                                log('- Dashboard should render');
                                
                                log('=== FIX VERIFICATION: SUCCESS ===', 'success');
                                log('Login flow should now work correctly!');
                                
                                // Cleanup
                                localStorage.removeItem('token');
                                localStorage.removeItem('user');
                                
                            } catch (error) {
                                log('State update failed: ' + error.message, 'error');
                            }
                        }
                        
                    } else {
                        log('Step 2: Login FAILED', 'error');
                    }
                } else {
                    log('Step 1: Registration FAILED', 'error');
                }
                
            } catch (error) {
                log('Test FAILED: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
